name: Build and Publish

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    strategy:
      matrix:
        configuration: [Debug, Release]

    runs-on: windows-latest

    env:
      Solution_Name: DenuvoWatch.sln
      Project_Directory: DenuvoWatch
      Project_Path: DenuvoWatch/DenuvoWatch.vbproj

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from version.json
        id: version
        run: |
          $json = Get-Content DenuvoWatch/version.json | ConvertFrom-Json
          $version = $json.version
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version"

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore
        run: msbuild $env:Solution_Name /t:Restore /p:Configuration=$env:Configuration
        env:
          Configuration: ${{ matrix.configuration }}

      - name: Build
        run: msbuild $env:Solution_Name /p:Configuration=$env:Configuration /p:Version=${{ steps.version.outputs.version }}
        env:
          Configuration: ${{ matrix.configuration }}

      - name: Publish (Release only)
        if: matrix.configuration == 'Release' && startsWith(github.ref, 'refs/tags/v')
        run: |
          $publishDir = "publish"
          dotnet publish $env:Project_Path -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:PublishTrimmed=false -p:Version=${{ steps.version.outputs.version }} -o $publishDir

          # Create a zip with only the necessary runtime files
          $zipPath = "DenuvoWatch-${{ steps.version.outputs.version }}.zip"
          $files = @(
            "$publishDir\DenuvoWatch.exe",
            "$publishDir\DenuvoWatch.dll",
            "$publishDir\DenuvoWatch.runtimeconfig.json"
          )
          Compress-Archive -Path $files -DestinationPath $zipPath

          Write-Host "Created $zipPath"

      - name: Upload build artifacts
        if: matrix.configuration == 'Release' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: DenuvoWatch-${{ steps.version.outputs.version }}
          path: DenuvoWatch-*.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          sudo apt-get install -y jq
          version=$(jq -r '.version' DenuvoWatch/version.json)
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: DenuvoWatch-${{ steps.version.outputs.version }}
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/DenuvoWatch-*.zip
          tag_name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
